{% extends 'core/base.html' %}

{% block title %}Удалить услугу{% endblock %}

{% block content %}
<h2>Удалить услугу?</h2>

<p>Вы уверены, что хотите удалить услугу <strong>{{ object.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'service-list' %}">Отмена</a>
</form>
{% endblock %}
