{% extends 'core/base.html' %}
{% block title %}Контакты{% endblock %}
{% block content %}
<h2>Контакты</h2>
{% for contact in contacts %}
<div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
    <h3>{{ contact.name }}</h3>
    <p>{{ contact.role }}</p>
    <p>Телефон: {{ contact.phone }}</p>
    <p>Email: {{ contact.email }}</p>
</div>
{% endfor %}
{% endblock %}
