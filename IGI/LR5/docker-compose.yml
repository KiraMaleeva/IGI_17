services:
  web:
    build: .
    platform: linux/amd64  # ДОБАВИТЬ ЭТУ СТРОКУ
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    # Если нужна БД, добавьте:
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    platform: linux/amd64  # ДОБАВИТЬ ЭТУ СТРОКУ
    environment:
      POSTGRES_USER: your_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: